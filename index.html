<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域名展示页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.3), rgba(0, 204, 255, 0.3)), url('https://via.placeholder.com/1920x1080') no-repeat center center/cover;
            backdrop-filter: blur(15px);
            text-align: center;
            padding: 20px;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 420px;
        }
        h1 {
            color: #007BFF;
            font-size: 1.8em;
        }
        .aliyun-buy-link {
            display: block;
            width: 150px;
            height: 40px;
            line-height: 40px;
            margin: 0 auto;
            color: #fff;
            font-size: 22px;
            background-color: #e91e63;
        }
        .contact {
            margin-top: 20px;
            font-size: 1em;
        }
        .contact p {
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contact p i {
            margin-right: 10px;
            color: #007BFF;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            height: 1px;
            background-color: #ccc;
            margin: 20px 0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><script>document.write(window.location.hostname)</script> 域名出售</h1>
        <p>该域名正在出售！您若有意购买，请联系我们。</p>
        
        <div class="price">

        </div>
        
        <div class="contact">
            <p><i class="fab fa-weixin"></i><strong>微信：</strong> 152-7122-6579</p>
            <p><i class="fab fa-qq"></i><strong>QQ：</strong> 290702556</p>
            <p><i class="fas fa-envelope"></i><strong>邮箱：</strong> <a href="mailto:290702556@qq.com">290702556@qq.com</a></p>

        <hr>
        
        <h1><script>document.write(window.location.hostname)</script> Domain for Sale</h1>
        <p>This domain is for sale! If you're interested in purchasing it, please contact us.</p>
        
        <div class="price">
          <a class="aliyun-buy-link" href="#">Buy Now</a>
        </div>
        
        <div class="contact">
            <p><i class="fab fa-weixin"></i><strong>WeChat:</strong> 152-7122-6579</p>

<script>
  (function() {
    // 1. 获取当前访问的域名
    var currentDomain = window.location.hostname;

    // 2. 拼接阿里云域名购买链接
    var targetUrl = 'https://mi.aliyun.com/domain-detail' +
      '?spm=5176.28712684.0.0.4b964a79zaWU84' +
      '&domain=' + encodeURIComponent(currentDomain) +
      '&orgType=undefined&productType=2&domainCartTradeParams=w3i2YvB2oi3Ngway6plx8&scm=true';

    // 3. 找到所有具有 aliyun-buy-link 类名的标签并统一更新 href
    var links = document.querySelectorAll('.aliyun-buy-link');
    links.forEach(function(link) {
      link.href = targetUrl;
    });
  })();
</script>
</body>
</html>
